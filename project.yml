name: IcyWeasel
options:
  bundleIdPrefix: com.icyweasel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    # MOHAMMADREZA SEPAHI. Debug builds stay ad-hoc signed ("-") so tests run
    # without a profile; release builds are signed by scripts/release.sh.
    DEVELOPMENT_TEAM: ZY74XX7D42
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  IcyWeasel:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["FilterLists/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icyweasel.browser
        PRODUCT_NAME: Icy Weasel
        CODE_SIGN_ENTITLEMENTS: Resources/IcyWeasel.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        # Written here, not as INFOPLIST_KEY_* build settings: with a custom
        # Info.plist those settings are silently ignored (App Store upload
        # rejected the missing category).
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Mohammadreza Sepahi"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleName: Icy Weasel
        CFBundleDisplayName: Icy Weasel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        LSFileQuarantineEnabled: true
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.icyweasel.browser.web
            CFBundleURLSchemes: [http, https]
        # A browser must load any site the user asks for, but only inside web
        # content. The app's own requests (filter lists over HTTPS, the local
        # AI model on localhost) stay under full App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # Only Apple's HTTPS and CryptoKit hashing: exempt from export filings.
        ITSAppUsesNonExemptEncryption: false

  IcyWeaselTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IcyWeaselTests
    dependencies:
      - target: IcyWeasel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icyweasel.browser.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Icy Weasel.app/Contents/MacOS/Icy Weasel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  IcyWeasel:
    build:
      targets:
        IcyWeasel: all
        IcyWeaselTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IcyWeaselTests
