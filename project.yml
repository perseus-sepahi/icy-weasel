name: IcyWeasel
options:
  bundleIdPrefix: com.icyweasel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    # MOHAMMADREZA SEPAHI. Debug builds stay ad-hoc signed ("-") so tests run
    # without a profile; release builds are signed by scripts/release.sh.
    DEVELOPMENT_TEAM: ZY74XX7D42
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    # Phonon's C module (scripts/fetch-phonon.sh), for the app and its tests.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/ThirdParty/Phonon/include

targets:
  IcyWeasel:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["FilterLists/**"]
    # Phonon's voice model for Read Page Aloud, from scripts/fetch-phonon.sh.
    # Copied by a script rather than listed as a resource, because it may be
    # absent (a fresh clone): then the app reads with Apple's voices. Code
    # signing runs after this, so the model is sealed like any resource.
    postBuildScripts:
      - name: Copy Phonon model
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/ThirdParty/Phonon/PhononModel"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PhononModel"
          if [ -d "$src" ]; then
            rsync -a --delete "$src/" "$dst/"
          else
            rm -rf "$dst"
            echo "warning: Phonon is not fetched (scripts/fetch-phonon.sh); Read Page Aloud will use Apple's voices."
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icyweasel.browser
        # Phonon's C library, arm64 only: the Intel slice never imports it
        # (PhononEngine checks `arch(arm64)`), so it never links it either.
        "LIBRARY_SEARCH_PATHS[arch=arm64]": $(SRCROOT)/ThirdParty/Phonon/lib
        PRODUCT_NAME: Icy Weasel
        CODE_SIGN_ENTITLEMENTS: Resources/IcyWeasel.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Resources/Info.plist
      properties:
        # Written here, not as INFOPLIST_KEY_* build settings: with a custom
        # Info.plist those settings are silently ignored (App Store upload
        # rejected the missing category).
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Mohammadreza Sepahi"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleName: Icy Weasel
        CFBundleDisplayName: Icy Weasel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        LSFileQuarantineEnabled: true
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.icyweasel.browser.web
            CFBundleURLSchemes: [http, https]
        # A browser must load any site the user asks for, but only inside web
        # content. The app's own requests (filter lists over HTTPS, the local
        # AI model on localhost) stay under full App Transport Security.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # Only Apple's HTTPS and CryptoKit hashing: exempt from export filings.
        ITSAppUsesNonExemptEncryption: false

  IcyWeaselTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IcyWeaselTests
    dependencies:
      - target: IcyWeasel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icyweasel.browser.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Icy Weasel.app/Contents/MacOS/Icy Weasel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  IcyWeasel:
    build:
      targets:
        IcyWeasel: all
        IcyWeaselTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IcyWeaselTests
